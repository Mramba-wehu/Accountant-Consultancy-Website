<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | Mwanje & Associates</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrapper">
        <div class="login-card reveal">
            <div class="login-header">
                <div class="admin-logo">
                    <span class="logo-main">MWANJE</span>
                    <span class="logo-sub">ASSOCIATES</span>
                </div>
                <h2>Admin Secure Access</h2>
                <p>Please enter your credentials to manage the portal.</p>
            </div>

            <form class="admin-form">
                <div class="form-group">
                    <label><i class="fas fa-user-shield"></i> Username</label>
                    <input type="text" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> 2FA Code (Optional)</label>
                    <input type="text" placeholder="000 000">
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember this device
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-admin-login">
                    <span>Secure Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Authorized Personnel Only</p>
                <a href="index.html" class="back-link"><i class="fas fa-home"></i> Back to Website</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
